[project]
name = "rci-contracts"
version = "0.1.0"
description = "JSON Schema validation for shared Retail Competitive Intelligence contracts."
requires-python = ">=3.12,<3.15"
dependencies = ["jsonschema[format-nongpl]==4.26.0"]

[project.scripts]
rci-contracts = "rci_contracts.cli:main"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

