[project]
name = "rci-agents"
version = "0.1.0"
description = "Governed AI interpretation for Retail Competitive Intelligence."
requires-python = ">=3.12,<3.15"
dependencies = [
  "openai==2.53.0",
  "rci-contracts",
  "sqlalchemy[asyncio]==2.0.51",
]

[tool.uv.sources]
rci-contracts = { workspace = true }

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"
