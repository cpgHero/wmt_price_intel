name: retail-competitive-intelligence

services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: rci
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rci"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  bucket:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-development-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - bucket-data:/data

volumes:
  bucket-data:
  postgres-data:
