name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce owner/admin documentation coverage
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check_platform_docs_coverage.py --base-ref "$BASE_REF"

  python:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: rci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rci
      RCI_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.14.6
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.11.28
          enable-cache: true
      - run: uv sync --frozen --all-packages --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy apps packages/python
      - run: uv run alembic -c database/alembic.ini upgrade head
      - run: uv run pytest
      - run: uv run rci-contracts --root .
      - run: uv run alembic -c database/alembic.ini downgrade base
      - run: uv run alembic -c database/alembic.ini upgrade head

  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: npm install --global pnpm@11.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @rci/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  containers:
    needs: [python, typescript]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [web, api, worker, scheduler]
    steps:
      - uses: actions/checkout@v4
      - run: >-
          docker build
          --file apps/${{ matrix.service }}/Dockerfile
          --tag rci-${{ matrix.service }}:${{ github.sha }}
          .
