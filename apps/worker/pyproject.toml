[project]
name = "rci-worker"
version = "0.1.0"
description = "Background execution service for Retail Competitive Intelligence."
requires-python = ">=3.12,<3.15"
dependencies = [
  "boto3==1.43.53",
  "duckdb==1.5.4",
  "httpx==0.28.1",
  "polars==1.43.2",
  "pyarrow==25.0.0",
  "rci-agents",
  "rci-contracts",
  "rci-analytics",
  "rci-collections",
  "rci-core",
  "rci-db",
  "rci-providers",
  "rci-product-packs",
  "rci-retailer-packs",
  "rci-products",
  "rci-results",
  "rci-studies",
]

[project.scripts]
rci-worker = "rci_worker.main:main"
rci-import-historical = "rci_worker.historical_cli:main"
rci-narrative-bakeoff = "rci_worker.narrative_bakeoff:main"
rci-publication-context = "rci_worker.publication_context:main"
rci-product-enrichment = "rci_worker.product_enrichment:main"
rci-pdp-normalization-audit = "rci_worker.pdp_normalization_audit:main"
rci-pdp-recover-raw = "rci_worker.pdp_recover_raw:main"

[tool.uv.sources]
rci-agents = { workspace = true }
rci-contracts = { workspace = true }
rci-analytics = { workspace = true }
rci-collections = { workspace = true }
rci-core = { workspace = true }
rci-db = { workspace = true }
rci-providers = { workspace = true }
rci-product-packs = { workspace = true }
rci-retailer-packs = { workspace = true }
rci-products = { workspace = true }
rci-results = { workspace = true }
rci-studies = { workspace = true }

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"
