[project]
name = "rci-api"
version = "0.1.0"
description = "FastAPI control-plane service for Retail Competitive Intelligence."
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.139.2",
  "rci-automation",
  "rci-analytics",
  "rci-core",
  "rci-collections",
  "rci-contracts",
  "rci-db",
  "rci-locations",
  "rci-product-packs",
  "rci-products",
  "rci-retailer-packs",
  "rci-results",
  "rci-studies",
  "uvicorn[standard]==0.51.0",
]

[tool.uv.sources]
rci-automation = { workspace = true }
rci-analytics = { workspace = true }
rci-core = { workspace = true }
rci-collections = { workspace = true }
rci-contracts = { workspace = true }
rci-db = { workspace = true }
rci-locations = { workspace = true }
rci-product-packs = { workspace = true }
rci-products = { workspace = true }
rci-retailer-packs = { workspace = true }
rci-results = { workspace = true }
rci-studies = { workspace = true }

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"
